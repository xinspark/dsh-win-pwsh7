# One Host row: it registers the two pwsh7 tools, runs the activation sweep, and serves the
# plugin page's diagnostics over its typert endpoint. It never writes the executor row's
# `pwshPath` — wiring the executor stays a patch edit the user makes.
- insert:
    - id: win-pwsh7
      name: dsh-win-pwsh7
# Coexistence override: keep dsh-ops Compatibility on while this bundle is installed. The
# loader warns and skips the override when dsh-ops is absent; the profile switch writes the
# matching disable row only when the user turns coexistence off.
- id: dsh-ops-compat
  name: dsh-ops/compat
  disabled: false
